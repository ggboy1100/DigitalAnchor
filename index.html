        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

        /**
         * Fetches data from the Gemini API with exponential backoff for retries.
         */
        async function fetchWithBackoff(url, options, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.status === 429) {
                        // Too Many Requests, calculate backoff delay
                        const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                        console.warn(`429 Too Many Requests. Retrying in ${Math.round(delay / 1000)}s...`);
                        await new Promise(resolve => setTimeout(resolve, delay));
                        continue; // Retry the request
                    }
                    if (!response.ok) {
                        throw new Error(`API request failed with status: ${response.status}`);
                    }
                    return response.json();
                } catch (error) {
                    if (i === maxRetries - 1) {
                        console.error("Gemini API call failed after max retries:", error);
                        throw error;
                    }
                    // For other errors, log and retry immediately
                    console.warn(`Attempt ${i + 1} failed. Retrying...`, error);
                }
            }
        }

        /**
         * Sends a prompt to the Gemini API and handles the response.
         */
        async function getGeminiResponse(prompt, systemInstruction = null) {
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                tools: [{ "google_search": {} }], // Use Google Search for grounding
            };
            
            if (systemInstruction) {
                payload.systemInstruction = { parts: [{ text: systemInstruction }] };
            }

            const options = {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            };

            try {
                const result = await fetchWithBackoff(API_URL, options);
                
                const candidate = result.candidates?.[0];
                if (candidate && candidate.content?.parts?.[0]?.text) {
                    return candidate.content.parts[0].text;
                } else {
                    return "Error: Could not retrieve a valid response from the AI assistant.";
                }
            } catch (error) {
                return "Error: Failed to connect to the AI service. Please try again later.";
            }
        }

        // --- Gemini Feature 1 Implementation: Instant Diagnosis ---

            const issueInput = document.getElementById('issue-description').value.trim();
            const outputDiv = document.getElementById('diagnosis-output');
            const contentDiv = document.getElementById('diagnosis-content');
            const loadingSpinner = document.getElementById('diagnosis-loading-spinner');
            
            if (!deviceInput || !issueInput) {
                contentDiv.innerHTML = '<p class="text-red-500 font-semibold">Please enter both the device type and a detailed issue description.</p>';
                outputDiv.classList.remove('hidden');
                return;
            }
            
            outputDiv.classList.add('hidden');
            loadingSpinner.classList.remove('hidden');

            const prompt = `Device: ${deviceInput}. Issue: ${issueInput}.`;
            const systemInstruction = `You are a preliminary tech support AI assistant for a repair company called Digital Anchor. Based on the provided device and issue, provide a concise, single-paragraph preliminary diagnosis, list 2-3 common causes, and suggest one simple, safe, non-invasive DIY troubleshooting step the user can try first. Format the output using bold markdown for titles (e.g., **Diagnosis:**, **Causes:**, **DIY Step:**). Do not offer professional repair quotes.`;

            try {
                const responseText = await getGeminiResponse(prompt, systemInstruction);
                contentDiv.innerHTML = responseText.replace(/\n/g, '<br>'); // Convert newlines to breaks for HTML display
                outputDiv.classList.remove('hidden');
            } catch (error) {
                contentDiv.innerHTML = `<p class="text-red-500">Failed to get diagnosis. Please check your connection or contact us directly.</p>`;
                outputDiv.classList.remove('hidden');
            } finally {
                loadingSpinner.classList.add('hidden');
            }
        }

            const contentDiv = document.getElementById('process-content');
            const loadingSpinner = document.getElementById('process-loading-spinner');

            if (!termInput) {
                contentDiv.innerHTML = '<p class="text-red-500 font-semibold">Please enter a technical term or repair process to explain.</p>';
                outputDiv.classList.remove('hidden');
                return;
            }

            outputDiv.classList.add('hidden');
            loadingSpinner.classList.remove('hidden');

            const prompt = `Explain the standard repair process for: ${termInput}.`;
            const systemInstruction = `You are a tech education assistant for Digital Anchor. Explain the standard professional repair process for the given technical term or issue in a brief, easy-to-understand list of 3-5 steps. Focus on what happens during the service. Start with **Step 1: Diagnostic**.`;

            try {
                const responseText = await getGeminiResponse(prompt, systemInstruction);
                // Convert Markdown list/text to HTML-friendly format
                let formattedText = responseText.replace(/\n\*\*/g, '<br><br>**').replace(/\*\*/g, '<strong>').replace(/:\s*<br>/g, ':</strong><br>').replace(/\n/g, '<br>');
                
                contentDiv.innerHTML = formattedText;
                outputDiv.classList.remove('hidden');
            } catch (error) {
                contentDiv.innerHTML = `<p class="text-red-500">Failed to get explanation. Please try again later.</p>`;
                outputDiv.classList.remove('hidden');
            } finally {

            }
        }

        // Listen for hash changes and initial load
        window.addEventListener('hashchange', router);
        window.addEventListener('load', router);
    </script>
</body>
</html>
